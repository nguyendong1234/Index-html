<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chúc Em May Mắn</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(to right, #ff9a9e, #fad0c4);
      font-family: 'Segoe UI', sans-serif;
      text-align: center;
      color: #fff;
    }

    .container {
      margin-top: 20vh;
      padding: 0 20px;
    }

    h1 {
      font-size: 3em;
      margin-bottom: 0.3em;
    }

    p {
      font-size: 1.5em;
      margin-top: 0;
    }

    .heart {
      font-size: 3em;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }

    audio {
      margin-top: 40px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="heart">♥</div>
    <h1>Chúc Em May Mắn</h1>
    <p>Dù ở đâu, em luôn bên trong suy nghĩ anh. Chúc em thành công và hạnh phúc!</p>
    <audio controls autoplay loop>
      <source src="https://www.bensound.com/bensound-music/bensound-romantic.mp3" type="audio/mp3">
      Trình duyệt của bạn không hỗ trợ nhạc nền.
    </audio>
  </div>
</body>
</html>
